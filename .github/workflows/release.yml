# Build XYZTools desktop installers and attach to a GitHub Release.
# Trigger: push tag v* (e.g. v0.0.1). Version must match release/VERSION.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos
          - platform: windows-latest
            os: windows
          - platform: ubuntu-22.04
            os: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf

      - name: Install & build
        run: |
          pnpm install
          cd xyztoolsapp
          if [ "${{ matrix.os }}" = "linux" ]; then
            pnpm tauri build --bundles deb
          else
            pnpm tauri build
          fi

      - name: Stage artifacts
        run: pnpm run release:collect
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xyztools-${{ matrix.os }}
          path: |
            release/assets/*.dmg
            release/assets/*.deb
            release/assets/*.exe
            release/assets/*.EXE
            release/assets/*.msi
            release/assets/*.AppImage
          if-no-files-found: error

  source:
    name: source-zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Source archive
        run: pnpm run release:source
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: xyztools-source
          path: release/assets/XYZTools-*-source.zip

  publish:
    name: github-release
    needs: [build, source]
    if: ${{ !cancelled() && needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten release folder
        run: |
          mkdir -p release/assets
          find dist -type f -size +0 \( \
            -iname '*.dmg' -o -iname '*.deb' -o -iname '*.exe' -o \
            -iname '*.msi' -o -iname '*.appimage' -o -iname '*.zip' \
          \) -exec cp -n {} release/assets/ \;
          find release/assets -type f -empty -delete
          cd release/assets
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files found under dist/"
            find ../../dist -type f | head -50
            exit 1
          fi
          shasum -a 256 * | awk '{print $1 "  " $2}' > SHA256SUMS
          ls -la

      - name: Read release version
        id: ver
        run: echo "version=$(tr -d '\n' < release/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/assets/*.dmg
            release/assets/*.exe
            release/assets/*.EXE
            release/assets/*.deb
            release/assets/*.msi
            release/assets/*.AppImage
            release/assets/*.zip
            release/assets/SHA256SUMS
          fail_on_unmatched_files: false
          overwrite_files: true
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
