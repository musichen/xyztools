# Build XYZTools desktop installers and attach to a GitHub Release.
# Trigger: push tag v* (e.g. v0.0.1). Version must match release/VERSION.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos
          - platform: windows-latest
            os: windows
          - platform: ubuntu-22.04
            os: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install & build
        run: |
          pnpm install
          cd xyztoolsapp
          pnpm tauri build

      - name: Stage artifacts
        run: pnpm run release:collect
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xyztools-${{ matrix.os }}
          path: release/assets/*
          if-no-files-found: error

  source:
    name: source-zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Source archive
        run: pnpm run release:source
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: xyztools-source
          path: release/assets/XYZTools-*-source.zip

  publish:
    name: github-release
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten release folder
        run: |
          mkdir -p release/assets
          find dist -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.exe' -o -name '*.msi' -o -name '*.zip' \) -exec cp -n {} release/assets/ \;
          cd release/assets
          shasum -a 256 XYZTools* xyztools* 2>/dev/null | awk '{print $1 "  " $2}' > SHA256SUMS || true

      - name: Read release version
        id: ver
        run: echo "version=$(tr -d '\n' < release/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          files: release/assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
