[package]
name = "xyztoolsapp"
version = "0.0.1"
description = "Tauri desktop UI for YouTube MP3 and transcripts (XYZTools)"
authors = ["XYZTools contributors"]
edition = "2021"
build = "build.rs"

[lib]
name = "xyztoolsapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync"] }
dirs = "5"
which = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
